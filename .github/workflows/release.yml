name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build-package:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
            cmake_extra: ""
          - os: ubuntu-22.04-arm
            arch: arm64
            cmake_extra: ""
          - os: macos-latest
            arch: universal
            cmake_extra: '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"'
          - os: windows-latest
            arch: x86_64
            cmake_extra: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM="3.5" ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        run: cd build && cpack -C Release

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.os }}-${{ matrix.arch }}
          path: build/gv2fsm-*

  release:
    needs: build-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la artifacts

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Create the release if it does not exist yet, generating notes.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes
          fi
          # Upload all packaged artifacts, clobbering any stale assets from a
          # previous run on this same tag so the release always carries the
          # freshly built packages.
          gh release upload "$TAG" artifacts/* --clobber
